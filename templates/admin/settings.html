{% extends "admin/base.html" %}
{% block atitle %}設定{% endblock %}
{% block content %}
<h1>設定</h1>
<div class="cols-2">
  <form method="post" class="panel">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <h2 style="margin-top:0;font-size:1.15rem">前台</h2>
    <label class="f">店名（顯示在前台）</label>
    <input type="text" name="store_name" value="{{ S.store_name }}">
    <label class="f" style="margin-top:12px">推薦幾款</label>
    <input type="number" name="top_n" min="3" max="10" value="{{ S.top_n }}" style="max-width:120px">
    <p style="margin-top:12px">
      <label class="check"><input type="checkbox" name="allow_member" value="1" {{ 'checked' if S.allow_member }}>開放會員功能（作答前輸入會員、排除玩過的遊戲、送點）</label><br>
      <label class="check"><input type="checkbox" name="show_price" value="1" {{ 'checked' if S.show_price }}>顯示售價（有庫存時）</label>
    </p>
    <h2 style="font-size:1.15rem;margin-top:18px">作答送點（本系統自己記點，不寫入 POS）</h2>
    <div class="form-grid">
      <div><label class="f">每次作答送幾點</label><input type="number" name="points_per_quiz" min="0" max="100000" value="{{ S.points_per_quiz }}"><p class="hint">0 表示不送點</p></div>
      <div><label class="f">每位會員每天最多領幾次</label><input type="number" name="points_daily_limit" min="0" max="100" value="{{ S.points_daily_limit }}"><p class="hint">0 表示不送點</p></div>
    </div>
    <p><button class="btn btn-felt btn-sm">儲存</button></p>
  </form>
  <form method="post" class="panel">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <input type="hidden" name="action" value="password">
    <h2 style="margin-top:0;font-size:1.15rem">修改後台密碼</h2>
    <label class="f">目前密碼</label><input type="password" name="current" required>
    <label class="f" style="margin-top:10px">新密碼（至少 6 碼）</label><input type="password" name="new" required minlength="6">
    <label class="f" style="margin-top:10px">再輸入一次</label><input type="password" name="new2" required minlength="6">
    <p><button class="btn btn-primary btn-sm">更新密碼</button></p>
  </form>
</div>
{% endblock %}
